[project]
name = "agents"
version = "0.1.0"
license = "MIT"
description = "LangGraph pipeline that removes low-quality images from YOLO datasets"
readme = "README.md"
requires-python = ">=3.12"

authors = [{ name = "Maciej Gierada", email = "maciek.gierada@gmail.com" }]

dependencies = [
  "langchain-ollama==1.1.0",
  "langchain==1.4.6",
  "langgraph==1.2.16",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "pydantic-settings==2.16.0",
  "structlog==26.1.0",
  "tqdm==4.70.1",
  "typer==0.27.3",
]

[project.scripts]
cleanup = "cleanup.cli:app"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1", "ty==0.0.89"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["src/cleanup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
