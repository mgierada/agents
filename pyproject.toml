[project]
name = "agents"
version = "0.1.0"
license = "MIT"
description = "LangGraph pipeline that removes low-quality images from YOLO datasets"
readme = "README.md"
requires-python = ">=3.12"

authors = [{ name = "Maciej Gierada", email = "maciek.gierada@gmail.com" }]

dependencies = [
  "langchain==1.4.7",
  "langgraph==1.2.17",
  "numpy==2.5.4",
  "opencv-python-headless==5.0.0.93",
  "pydantic-settings==2.16.1",
  "typer==0.27.3",
]

exclude-newer = "7 days"

[project.scripts]
cleanup = "cleanup.cli:app"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.2", "ty==0.0.91"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleanup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
